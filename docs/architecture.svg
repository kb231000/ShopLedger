<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and checkout flow</title>
<desc id="desc">Browser, Express, routers and business modules connect to a JSON store. The printable invoice and GST Audit share invoice figures. Six steps trace the checkout write.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#4b6684"/></marker></defs>
<style>
text{font-family:Arial,sans-serif;fill:#182b43}.title{font-size:38px;font-weight:700}.sub{font-size:16px;fill:#475f78}.id{font-size:13px;font-weight:700;fill:#426487}.head{font-size:20px;font-weight:700}.mono{font:14px Consolas,monospace}.arrow{fill:none;stroke:#4b6684;stroke-width:2;marker-end:url(#arrow)}.flow{font-size:16px}.num{font-size:14px;font-weight:700;fill:#fff}
</style>
<rect width="1200" height="800" fill="#f4f7fb"/>
<text x="44" y="64" class="title">ShopLedger architecture</text>
<text x="46" y="94" class="sub">Retail and wholesale billing · Inventory · Customer Khata · GST invoicing</text>
<g transform="translate(44,132)"><rect width="254" height="176" rx="14" fill="#fff" stroke="#cad6e2"/><text x="18" y="31" class="id">01</text><text x="18" y="61" class="head">Browser UI</text><text x="18" y="89" class="mono">public/index.html</text><text x="18" y="109" class="mono">public/js/app.js</text><text x="18" y="129" class="mono">public/css/style.css</text></g><g transform="translate(330,132)"><rect width="254" height="176" rx="14" fill="#fff" stroke="#cad6e2"/><text x="18" y="31" class="id">02</text><text x="18" y="61" class="head">Express entry</text><text x="18" y="89" class="mono">server.js</text><text x="18" y="109" class="mono">static UI and /api</text><text x="18" y="129" class="mono">GET /orders/:id/invoice</text></g><g transform="translate(616,132)"><rect width="254" height="176" rx="14" fill="#fff" stroke="#cad6e2"/><text x="18" y="31" class="id">03</text><text x="18" y="61" class="head">API routers</text><text x="18" y="89" class="mono">routes/orders.js</text><text x="18" y="109" class="mono">routes/products.js</text><text x="18" y="129" class="mono">routes/customers.js</text><text x="18" y="149" class="mono">routes/reports.js</text></g><g transform="translate(902,132)"><rect width="254" height="176" rx="14" fill="#fff" stroke="#cad6e2"/><text x="18" y="31" class="id">04</text><text x="18" y="61" class="head">Business logic</text><text x="18" y="89" class="mono">lib/pricing.js · lib/coupons.js</text><text x="18" y="109" class="mono">lib/tax.js · lib/inventory.js</text><text x="18" y="129" class="mono">lib/orders.js · lib/dates.js</text><text x="18" y="149" class="mono">lib/ledger.js · lib/reports.js</text></g>
<path class="arrow" d="M299 219H326"/><path class="arrow" d="M585 219H612"/><path class="arrow" d="M871 219H898"/>
<path class="arrow" d="M457 308V336H457V357"/><path class="arrow" d="M743 308V336H555V357"/>
<path class="arrow" d="M970 308V336H735V357"/>
<rect x="44" y="359" width="302" height="106" rx="14" fill="#e8eef7" stroke="#b4c6d9"/>
<text x="62" y="389" class="head">Shop configuration</text><text x="62" y="416" class="mono">config.js</text><text x="62" y="443" class="sub">Shop details, HSN rates, coupon rules</text>
<rect x="374" y="359" width="240" height="106" rx="14" fill="#d8f5e8" stroke="#258261" stroke-width="2"/>
<text x="392" y="389" class="head">Invoice figures</text><text x="392" y="416" class="mono">lib/invoice.js</text><text x="392" y="443" class="sub">Print view and GST Audit</text>
<rect x="642" y="359" width="228" height="106" rx="14" fill="#fff" stroke="#cad6e2"/>
<text x="660" y="389" class="head">Persistence</text><text x="660" y="416" class="mono">lib/store.js</text><text x="660" y="443" class="sub">Read, write, append audit</text>
<path class="arrow" d="M870 410H898"/><path class="arrow" d="M346 410H372"/>
<rect x="900" y="359" width="254" height="106" rx="14" fill="#fff" stroke="#cad6e2"/>
<text x="918" y="389" class="head">JSON datastore</text><text x="918" y="416" class="mono">data/db.json</text><text x="918" y="443" class="sub">Products, orders, Khata, audit</text>
<text x="44" y="512" class="head">Placing an order</text>
<rect x="982" y="493" width="16" height="16" rx="3" fill="#d8f5e8" stroke="#258261"/><text x="1008" y="506" class="sub">Ticket 1 scope</text>
<circle cx="58" cy="550" r="13" fill="#274c70"/><text x="58" y="555" class="num" text-anchor="middle">1</text><text x="83" y="555" class="flow">Submit the cart via POST /api/orders.</text><circle cx="58" cy="589" r="13" fill="#274c70"/><text x="58" y="594" class="num" text-anchor="middle">2</text><text x="83" y="594" class="flow">Read the datastore and resolve product IDs, prices, and HSN codes.</text><circle cx="58" cy="628" r="13" fill="#274c70"/><text x="58" y="633" class="num" text-anchor="middle">3</text><text x="83" y="633" class="flow">Check sellable stock, validate the coupon, and compute totals.</text><circle cx="58" cy="667" r="13" fill="#274c70"/><text x="58" y="672" class="num" text-anchor="middle">4</text><text x="83" y="672" class="flow">For a Khata sale, check the credit limit and post the customer debit.</text><circle cx="58" cy="706" r="13" fill="#274c70"/><text x="58" y="711" class="num" text-anchor="middle">5</text><text x="83" y="711" class="flow">Deduct physical stock and add the order with its billed totals.</text><circle cx="58" cy="745" r="13" fill="#274c70"/><text x="58" y="750" class="num" text-anchor="middle">6</text><text x="83" y="750" class="flow">Append ORDER_CREATED, write the JSON file, and return HTTP 201.</text>
</svg>
